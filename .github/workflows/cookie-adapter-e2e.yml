name: Cookie adapter E2E

on:
  push:
    branches: [ci/cookie-method-context]

permissions:
  contents: read

jobs:
  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix .validation --no-save --package-lock=false playwright@1.56.1 esbuild@0.25.10
          node .validation/node_modules/playwright/cli.js install --with-deps chromium
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.114.0
          github-token: ${{ github.token }}
      - name: Start disposable Supabase backend
        run: |
          mkdir -p .validation/backend
          supabase init --workdir .validation/backend --yes
          supabase start --workdir .validation/backend --exclude realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor > .validation/stack-start.log 2>&1
          supabase status --workdir .validation/backend --output json > .validation/supabase-status.json
      - name: Exercise public clients with real Auth and Chromium
        timeout-minutes: 5
        run: node .validation/cookie-adapter-e2e.mjs
      - name: Stop disposable backend
        if: always()
        run: supabase stop --workdir .validation/backend --no-backup
